<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img">
<title>WBRG1 na JM-SMWG01-MINI V2.6</title>
<desc>WBRG1 com antena à direita e USB-C para cima. Borda de cima W1 a W9: GND, EN, PB4, PB7, PB6, PB5, PA28, RX0, RTS0. Borda esquerda W10 a W16: PRI, REQ, GNT, TX0, CTS0, RX1, TX1. Borda de baixo W17 a W25: 3V3, PA25, PB22, AOUT, MIC GND, MIC1, Log TX, Log RX, PB23.</desc>
