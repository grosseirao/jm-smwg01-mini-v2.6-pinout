<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img">
<title>ZS3L na JM-SMWG01-MINI V2.6</title>
<desc>ZS3L com antena à esquerda e USB-C para cima. Fileira de cima Z1 a Z8 são os pinos oficiais 16 a 9; fileira de baixo Z9 a Z16 são os pinos 1 a 8; borda direita Z17 a Z22 são os pinos de gravação 22 a 17.</desc>
