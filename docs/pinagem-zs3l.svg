.ts{font:12px sans-serif;fill:#444441}
.th{font:500 13px sans-serif;fill:#2C2C2A}
.n{font:500 11px sans-serif;fill:#2C2C2A}
.box{fill:#F1EFE8;stroke:#888780;stroke-width:.5}
.ok{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.8}
.ds{fill:#FAECE7;stroke:#993C1D;stroke-width:.8}
.no{fill:#FFFFFF;stroke:#888780;stroke-width:.6}
</style>
<rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/>
<text class="th" x="20" y="24">ZS3L (EFR32MG21) na JM-SMWG01-MINI V2.6, componentes para cima, USB-C em cima</text>
